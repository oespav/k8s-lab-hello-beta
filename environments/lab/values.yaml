# hello-beta in the lab cluster. Team Beta owns this file.
# v2 canary in progress: 50/50 split between v1 and v2.
versions:
  v1:
    image: docker.io/istio/examples-helloworld-v1:1.0
    replicas: 1
    weight: 50
  v2:
    image: docker.io/istio/examples-helloworld-v2:1.0
    replicas: 1
    weight: 50

gateway:
  name: internal
  namespace: infra-gw
  sectionName: https

route:
  hostnames:
    - tools.internal.localhost
  pathPrefix: /hello
  canaryHeader:
    enabled: false
