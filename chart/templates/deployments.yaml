{{- /* One Deployment per entry in .Values.versions. */}}
{{- range $version, $cfg := .Values.versions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helloworld.fullname" $ }}-{{ $version }}
  labels:
    {{- include "helloworld.labels" $ | nindent 4 }}
    version: {{ $version }}
spec:
  replicas: {{ $cfg.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "helloworld.selectorLabels" (dict "root" $ "version" $version) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helloworld.selectorLabels" (dict "root" $ "version" $version) | nindent 8 }}
    spec:
      # The app never calls the Kubernetes API, and ambient mesh identity comes
      # from ztunnel, not from a token in the pod.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: helloworld
          image: {{ required (printf "versions.%s.image is required" $version) $cfg.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /hello
              port: http
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; gunicorn needs a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
